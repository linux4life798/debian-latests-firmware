name: Build and Release Packages

# Process for release:
# - Pull in upstream linux-firmware changes
# - Push branch debian-latest-without-microcode to github
# - Created signed and annotated tag based on the upstream tag.
#   We use the debian package revision "-number" suffix to iterate on the
#   upstream linux-firmware tags.
#   git tag --sign 20250613-8
# - Push the tag to github. For some reason, you need to wait for the first push
#   build to complete, before pushing this tag. Otherwise, you will see that git
#   describe will fail in the debian pkg build step, resulting in an incorrectly
#   versioned deb pkg. This might be due to git checkout caching.
#   git push github 20250613-8
#
# - Wait for the build to complete
# - Download the packages and test

permissions:
  contents: write

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        if: github.ref_type != 'tag'
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout repository for tag
        uses: actions/checkout@v4
        if: github.ref_type == 'tag'
        # Unfortunately, `git describe` will not function correctly if this
        # action is triggered by an annotated tag, unless we force it to fetch
        # ${{ github.ref }}.
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.ref }}

      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git rdfind debhelper rpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Show git describe, since GitHub has an issue with annotated tags.
      # When the issue is not mitigated, the following two git describes will
      # show different tags. Normal `git describe` will show nothing or an old
      # tag, where `git describe --tags` will show the latest/correct tag.
      - name: Show git describe
        run: git describe || echo "'git describe' failed"
      - name: Show git describe --tags
        run: git describe --tags || echo "'git describe --tags' failed"

      - name: Build Debian package
        run: make deb

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*

      - name: Create Release
        id: create_release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
